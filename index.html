<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana Balance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Solana Balance Tracker</h1>
        <p class="subtitle">Enter a wallet address to check its SOL balance</p>

        <div class="input-group">
            <input
                type="text"
                id="walletAddress"
                placeholder="Enter Solana wallet address..."
                autocomplete="off"
                spellcheck="false"
            >
            <button id="checkBalance" type="button">Check Balance</button>
        </div>

        <div id="balanceDisplay" class="balance-display">
            Balance: <span id="balanceAmount">—</span> SOL
        </div>

        <div id="errorMessage" class="error-message" hidden></div>

      <p class="hint" id="hint">
  <span id="hintText"></span>
  <a id="hintLink" href="#" target="_blank" rel="noopener"></a>
</p>

<script>
  (function () {
    const hintText = document.getElementById('hintText');
    const hintLink = document.getElementById('hintLink');

    // If opened from file://, origin may be "null" — show local-server instructions.
    if (location.protocol === 'file:' || location.origin === 'null') {
      hintText.textContent = 'Running locally: start a simple static server (e.g. ';
      hintLink.href = 'http://127.0.0.1:5500';
      hintLink.textContent = 'http://127.0.0.1:5500';
      // append closing text after the link
      const closing = document.createTextNode(') then open it in your browser.');
      hintLink.parentNode.appendChild(closing);
    } else {
      // Hosted — show the app URL based on current origin
      hintText.textContent = 'This app is hosted at ';
      hintLink.href = location.origin;
      hintLink.textContent = location.origin;
      const closing = document.createTextNode(' — open that URL in your browser.');
      hintLink.parentNode.appendChild(closing);
    }
  })();
</script>
        </p>
    </div>
    <script src="script.js"></script>
</body>
</html>
